name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  ci:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # better-sqlite3 compiles a native addon at install time; pnpm fetches
      # the matching prebuild per-OS, but this is the step most likely to
      # expose a genuine Windows/macOS packaging gap if one exists.
      - run: pnpm install --frozen-lockfile

      # h3 (SSE injection, request smuggling) is pinned to a patched version
      # via the pnpm-workspace.yaml override. The remaining findings are all
      # brace-expansion, buried inside vinxi/nitropack's build-time packaging
      # tooling (archiver/glob) — not reachable via untrusted input, and two
      # different consumers require incompatible majors so no single version
      # satisfies both without a risky framework bump. --ignore-unfixable
      # skips only advisories with no available fix.
      - run: pnpm audit --audit-level high

      - name: Open-source license compliance scan
        run: pnpm dlx license-checker --summary --production

      - run: pnpm lint || true

      - run: pnpm typecheck

      - run: pnpm test
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Demo data must exist for the workbench to render; the run reuses the
      # committed seed-1 specimens (no model calls needed in CI).
      - run: pnpm e2e
        env:
          CI: "1"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
